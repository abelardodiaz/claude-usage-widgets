[package]
name = "claude-usage-widgets"
version = "0.1.1"
description = "Widget de escritorio con el uso de tu plan de Claude"
authors = ["Abelardo Diaz"]
license = "MIT"
repository = "https://github.com/abelardodiaz/claude-usage-widgets"
edition = "2024"
rust-version = "1.90"

[lib]
# El sufijo _lib evita el choque de nombres con el binario en Windows.
name = "claude_usage_widgets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Base IANA embebida (tzdb-bundle-always) y SIN tzdb-zoneinfo: Windows y Ubuntu calculan con la
# misma tzdata (D11). tz-system detecta la zona del dispositivo y la resuelve en esa base.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "serde", "tz-system", "tz-fat", "tzdb-bundle-always", "perf-inline"] }
thiserror = "=2.0.21"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
dirs = "=7.0.0"
sys-locale = "=0.3.2"

[dev-dependencies]
tempfile = "=3.27.0"
# Solo para la prueba de guarda: ureq/ureq_proto nunca a Trace (vuelca la cabecera Authorization).
log = "=0.4.34"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
