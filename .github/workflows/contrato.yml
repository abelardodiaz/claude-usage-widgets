name: contrato
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r spec/requirements.txt
      - run: python spec/validate.py
        env:
          # Resolver siempre con el tzdata fijado, no con /usr/share/zoneinfo del runner.
          PYTHONTZPATH: ""
