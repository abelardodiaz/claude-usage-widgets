name: contrato
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r spec/requirements.txt
      - run: python spec/validate.py
        env:
          # Resolver siempre con el tzdata fijado, no con /usr/share/zoneinfo del runner.
          PYTHONTZPATH: ""
