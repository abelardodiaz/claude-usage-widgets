version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # tzdata caduca de verdad: la base IANA cambia varias veces al anio.
  - package-ecosystem: pip
    directory: /spec
    schedule:
      interval: weekly
  # Incluye jiff-tzdb, la copia embebida de tzdata del widget (D11).
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
