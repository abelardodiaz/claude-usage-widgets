version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # tzdata caduca de verdad: la base IANA cambia varias veces al anio.
  - package-ecosystem: pip
    directory: /spec
    schedule:
      interval: weekly
  # Incluye jiff-tzdb, la copia embebida de tzdata del widget (D11).
  # desktop/lite fija las mismas versiones exactas que src-tauri para el nucleo compartido:
  # group-by dependency-name hace un solo PR por dependencia que actualiza los dos Cargo.lock
  # a la vez (el job lite del CI falla si se separan).
  - package-ecosystem: cargo
    directories:
      - /desktop/src-tauri
      - /desktop/lite
    schedule:
      interval: weekly
    groups:
      cargo-por-dependencia:
        group-by: dependency-name
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
