<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #16181d; --panel: #1d2027; --line: #2a2e37; --track: #262a32;
    --text: #e7e9ee; --muted: #8b919c; --dim: #5f6570;
    --green: #3fbf6f; --amber: #e8b03f; --red: #e5534b;
    --cc: #e88a5c; --cowork: #a98bf0; --chat: #5aa7e8; --other: #7d828c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  .card { padding: 12px 14px 12px; }
  .head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .head .lbl { font-weight: 700; letter-spacing: .06em; font-size: 12px; color: var(--muted); margin-right: 2px; }
  .ico { width: 24px; height: 22px; display: grid; place-items: center; border-radius: 6px;
    color: var(--muted); cursor: pointer; border: 1px solid transparent; }
  .ico:hover { color: var(--text); background: var(--panel); }
  .ico.on { color: var(--amber); border-color: var(--amber); }
  .ico svg { width: 14px; height: 14px; }
  .head .sp { flex: 1; }
  .head .today-num { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .row { margin: 9px 0 0; }
  .row .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .row .t b { font-weight: 700; letter-spacing: .05em; }
  .row .t b span { font-size: 14px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .row .t .r { color: var(--muted); font-size: 11.5px; }
  .bar { height: 7px; border-radius: 4px; background: var(--track); margin-top: 5px; overflow: hidden; position: relative; }
  .bar i { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
  .bar .mark { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--muted); opacity: .7; }
  .extra .t b { font-weight: 600; color: var(--muted); letter-spacing: .03em; }
  .extra .bar { height: 4px; }
  .foot { margin-top: 9px; font-size: 10.5px; color: var(--dim); display: flex; justify-content: space-between; }
  .err { color: var(--amber); }
  .panel { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .panel h4 { font-size: 10.5px; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 8px; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 90px; position: relative; padding-top: 12px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart .col .v { font-size: 9.5px; color: var(--muted); margin-bottom: 2px; }
  .chart .col .b { width: 100%; max-width: 26px; border-radius: 3px 3px 1px 1px; background: var(--dim); min-height: 2px; }
  .chart .col.today .b { background: var(--amber); }
  .chart .col.over .b { background: var(--red); }
  .days { display: flex; gap: 8px; margin-top: 4px; }
  .days span { flex: 1; text-align: center; font-size: 10px; color: var(--dim); }
  .days span.today { color: var(--text); font-weight: 600; }
  .limit { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--dim); }
  .limit em { position: absolute; right: 0; top: -13px; font-size: 9.5px; color: var(--dim); font-style: normal; }
  .stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--track); margin-bottom: 8px; gap: 2px; }
  .legend div { display: flex; align-items: center; gap: 7px; font-size: 11.5px; padding: 2px 0; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; }
  .legend b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .note { font-size: 10px; color: var(--dim); margin-top: 6px; }
  .proj { border-left: 2px solid var(--line); padding: 4px 0 4px 9px; margin-bottom: 7px; }
  .proj small { font-size: 9.5px; color: var(--dim); letter-spacing: .08em; }
  .proj p { font-weight: 600; font-size: 12px; }
  .proj p + p { font-weight: 400; color: var(--muted); font-size: 10.5px; }
  .proj.warn { border-color: var(--amber); }
  .proj.bad { border-color: var(--red); }
  .proj.ok { border-color: var(--green); }
</style>
</head>
<body>
<div class="card" id="root">
  <div class="head">
    <span class="lbl">HOY</span>
    <span class="ico" data-p="hist" title="Ultimos 7 dias"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="9" width="3" height="5" rx="1"/><rect x="6.5" y="5" width="3" height="9" rx="1"/><rect x="11" y="2" width="3" height="12" rx="1"/></svg></span>
    <span class="ico" data-p="mix" title="Desglose de la semana"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 2v6h6" fill="currentColor" fill-opacity=".35"/></svg></span>
    <span class="ico" data-p="proj" title="Proyeccion"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4-4 3 3 5-6"/><path d="M10 5h4v4"/></svg></span>
    <span class="sp"></span>
    <span class="today-num" id="todayNum">--</span>
    <span class="ico" id="btnRefresh" title="Actualizar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></span>
    <span class="ico" id="btnClose" title="Cerrar"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></span>
  </div>
  <div class="bar"><i id="todayBar"></i></div>

  <div class="row"><div class="t"><b>SESION 5 H<span id="sPct">--</span></b><span class="r" id="sReset"></span></div>
    <div class="bar"><i id="sBar"></i></div></div>
  <div class="row"><div class="t"><b>SEMANA<span id="wPct">--</span></b><span class="r" id="wReset"></span></div>
    <div class="bar"><i id="wBar"></i><span class="mark" id="wMark"></span></div></div>
  <div id="extra"></div>

  <div class="panel" id="panel" hidden></div>
  <div class="foot"><span id="status"></span><span id="updated"></span></div>
</div>

<script>
const $ = id => document.getElementById(id);
const DAYS = ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"];
const DAYS_LONG = ["domingo", "lunes", "martes", "miercoles", "jueves", "viernes", "sabado"];
const COLORS = { claude_code: "var(--cc)", cowork: "var(--cowork)", chat: "var(--chat)", other: "var(--other)" };
let data = null, open = null;

const hm = d => d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false });
function when(iso) {
  if (!iso) return "--";
  const d = new Date(iso), now = new Date();
  const days = Math.round((new Date(d.toDateString()) - new Date(now.toDateString())) / 864e5);
  if (days === 0) return hm(d);
  if (days === 1) return "manana " + hm(d);
  if (days < 7) return DAYS_LONG[d.getDay()] + " " + hm(d);
  return d.toLocaleDateString("es-MX", { day: "numeric", month: "short" }) + " " + hm(d);
}
const level = p => p < 60 ? "var(--green)" : p < 85 ? "var(--amber)" : "var(--red)";
function setBar(el, pct, color) { el.style.width = Math.min(Math.max(pct, 0), 100) + "%"; el.style.background = color; }

function render() {
  if (!data) return;
  $("status").innerHTML = data.error ? `<span class="err">${data.error}</span>` : "";
  $("updated").textContent = data.updated ? "act. " + hm(new Date(data.updated)) : "";
  if (!data.session) { fit(); return; }

  const t = data.today, ratio = t.quota > 0 ? t.used / t.quota : 0;
  $("todayNum").textContent = `${t.used}% de ${t.quota}%`;
  setBar($("todayBar"), ratio * 100, ratio < .7 ? "var(--green)" : ratio < 1 ? "var(--amber)" : "var(--red)");

  const s = data.session, w = data.week;
  $("sPct").textContent = Math.round(s.util) + "%";
  $("sReset").textContent = "Reinicio: " + when(s.resets_at);
  setBar($("sBar"), s.util, level(s.util));
  $("wPct").textContent = Math.round(w.util) + "%";
  $("wReset").textContent = "Reinicio: " + when(w.resets_at);
  setBar($("wBar"), w.util, level(w.util));
  // marca: donde "deberias" ir si repartes parejo los 7 dias
  const elapsed = 1 - (new Date(w.resets_at) - new Date()) / (7 * 864e5);
  $("wMark").style.left = Math.min(Math.max(elapsed, 0), 1) * 100 + "%";
  $("wMark").title = "Ritmo parejo: " + Math.round(elapsed * 100) + "%";

  $("extra").innerHTML = data.extra.map(e => `
    <div class="row extra"><div class="t"><b>SEMANA ${e.name.toUpperCase()}<span>${Math.round(e.percent)}%</span></b>
      <span class="r">${e.resets_at ? "Reinicio: " + when(e.resets_at) : ""}</span></div>
      <div class="bar"><i style="width:${Math.min(e.percent, 100)}%;background:${level(e.percent)}"></i></div></div>`).join("");

  renderPanel();
  fit();
}

function renderPanel() {
  const p = $("panel");
  document.querySelectorAll(".ico[data-p]").forEach(el => el.classList.toggle("on", el.dataset.p === open));
  if (!open || !data || !data.session) { p.hidden = true; return; }
  p.hidden = false;
  const close = `<span class="ico" onclick="toggle(null)" style="width:18px;height:16px"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></span>`;

  if (open === "hist") {
    const h = data.history, q = data.today.quota;
    const max = Math.max(q, ...h.map(d => d.used), 1) * 1.15;
    const todayIso = h[h.length - 1].date;
    const since = data.today.tracking_since;
    p.innerHTML = `<h4>ULTIMOS 7 DIAS ${close}</h4>
      <div class="chart">
        <div class="limit" style="bottom:${q / max * 78}px"><em>cupo hoy ${q}%</em></div>
        ${h.map(d => `<div class="col ${d.date === todayIso ? "today" : ""} ${d.used > q ? "over" : ""}">
          <span class="v">${d.used ? d.used + "%" : ""}</span>
          <div class="b" style="height:${d.used / max * 78}px"></div></div>`).join("")}
      </div>
      <div class="days">${h.map(d => {
        const dt = new Date(d.date + "T12:00");
        return `<span class="${d.date === todayIso ? "today" : ""}">${d.date === todayIso ? "Hoy" : DAYS[dt.getDay()]}</span>`;
      }).join("")}</div>
      <div class="note">% de la cuota semanal gastado cada dia.${since ? " Registrando desde " + when(since) + "." : ""}</div>`;
  } else if (open === "mix") {
    const rows = data.breakdown.filter(r => r.key !== "other" || r.percent > 0);
    p.innerHTML = `<h4>DESGLOSE DE LA SEMANA ${close}</h4>
      <div class="stack">${rows.filter(r => r.percent > 0).map(r =>
        `<span style="flex:${r.percent};background:${COLORS[r.key] || "var(--other)"}"></span>`).join("")}</div>
      <div class="legend">${data.breakdown.map(r =>
        `<div><i style="background:${COLORS[r.key] || "var(--other)"}"></i>${r.display_name}<b>${r.percent}%</b></div>`).join("")}</div>
      <div class="note">Reparto de lo que usaste esta semana (${Math.round(data.week.util)}% de tu cuota).</div>`;
  } else if (open === "proj") {
    const item = (label, x, resetIso) => {
      if (!x.hits) return `<div class="proj ok"><small>${label}</small><p>Sin uso suficiente para estimar</p></div>`;
      const d = new Date(x.hits);
      const cls = x.before_reset ? (d - new Date() < 3 * 36e5 ? "bad" : "warn") : "ok";
      const head = x.before_reset ? `Llegarias al 100% ${when(x.hits)}` : `No llegas al limite antes del reinicio`;
      const sub = x.before_reset ? `Antes del reinicio (${when(resetIso)}).` : `Al ritmo actual tocarias 100% ${when(x.hits)}; reinicia ${when(resetIso)}.`;
      return `<div class="proj ${cls}"><small>${label}</small><p>${head}</p><p>${sub}</p></div>`;
    };
    p.innerHTML = `<h4>PROYECCION ${close}</h4>
      ${item("SESION 5 H", data.session, data.session.resets_at)}
      ${item("SEMANA", data.week, data.week.resets_at)}
      <div class="note">Estimacion con tu ritmo promedio desde que abrio cada ventana.</div>`;
  }
}

function toggle(name) { open = open === name ? null : name; renderPanel(); fit(); }
function fit() { requestAnimationFrame(() => window.pywebview?.api.resize(Math.ceil($("root").getBoundingClientRect().height))); }

async function load(force = false) {
  try { data = await window.pywebview.api.get_data(force); }
  catch (e) { data = { error: String(e) }; }
  render();
}

document.querySelectorAll(".ico[data-p]").forEach(el => el.addEventListener("click", () => toggle(el.dataset.p)));
$("btnRefresh").addEventListener("click", () => load(true));
$("btnClose").addEventListener("click", () => window.pywebview.api.close());
window.addEventListener("pywebviewready", () => { load(); setInterval(load, 120000); });
</script>
</body>
</html>
